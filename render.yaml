services:
  - type: web
    name: shopzen-ai-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
