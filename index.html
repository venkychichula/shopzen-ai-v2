<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopZen AI V2</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="badge">SHOPZEN AI V2</span>
      <h1>Your AI shopping co-pilot.</h1>
      <p>Compare, understand, and decide — without pretending uncertain data is fact.</p>
    </section>

    <section id="chat" class="chat"></section>

    <form id="chat-form" class="composer">
      <input id="message" autocomplete="off"
             placeholder="Ask: Which laptop is best for CSE under ₹70,000?">
      <button>Ask ShopZen</button>
    </form>

    <p class="status" id="status">V2 foundation online.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
